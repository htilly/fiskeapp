# nginx inuti fiskeapp-imagen. Servar den byggda PWA:n och proxar /api/ till
# Fastify i samma container. SWAG på tillyse står framför och terminerar TLS.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fotouppladdning: API:t tar max 8 MB per fil, lite marginal här.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Service workern måste få hämtas färsk, annars fastnar klienten i en
    # gammal version av appen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
